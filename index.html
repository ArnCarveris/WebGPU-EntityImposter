        this.device.queue.writeBuffer(this.shadowBuf, 0, S);
    }

    patternTexture(def) {
        const key = JSON.stringify([def.pattern, def.colors, def.seed, def.size, def.alphaCutoff]);
        let t = this.patterns.get(key);
        if (!t) this.patterns.set(key, t = uploadImage(this.device, TextureFactory.canvas(def), def.alphaCutoff || 0));
        return t;
    }

    resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2), c = this.canvas;
        const w = Math.max(1, Math.floor(c.clientWidth * dpr)), h = Math.max(1, Math.floor(c.clientHeight * dpr));
        if (this.msaaTex && c.width === w && c.height === h) return;
        c.width = w; c.height = h;
        this.msaaTex?.destroy(); this.depthTex?.destroy();
        const U = GPUTextureUsage.RENDER_ATTACHMENT;
        this.msaaTex = this.device.createTexture({ size: [w, h], format: this.format, sampleCount: MSAA, usage: U });
        this.depthTex = this.device.createTexture({ size: [w, h], format: DEPTH_FORMAT, sampleCount: MSAA, usage: U });
        this.msaaView = this.msaaTex.createView();
        this.depthView = this.depthTex.createView();
    }

    writeGlobals(cam, env, st, time) {
        const g = this.globals, W = this.canvas.width, H = this.canvas.height;
        const vp = m4.mul(m4.perspective(cam.fov * DEG, W / H, 0.1), cam.view());
        g.set(vp, 0);
        g.set([...cam.pos, time], 16);
        g.set([...env.sunDir, env.exposure], 20);
        g.set([...env.sunColor, env.sunIntensity], 24);
        g.set([...env.skyTop, 0], 28);
        g.set([...env.skyHorizon, 0], 32);
        g.set([...env.ambientSky, 0], 36);
        g.set([...env.ambientGround, env.ambientStrength], 40);
        g.set([...env.fogColor, env.fogDensity], 44);
        this.camPlanes = frustumPlanes(vp);
        this.camPlanes.forEach((p, i) => g.set(p, 48 + i * 4));
        g.set([st.lodDistance, st.fade, st.far, LOD_MODES.indexOf(st.lodMode)], 72);
        g.set([st.blend ? 1 : 0, st.parallax ? 1 : 0, st.depthOffset ? 1 : 0, st.tint ? 1 : 0], 76);
        g.set(m4.invert(vp), 80);
        g.set([W, H, 1 / W, 1 / H], 96);
        g.set([env.emission, 0, 0, 0], 100);
        g.set([...cam.forward(), 0], 104);
        this.device.queue.writeBuffer(this.globalBuf, 0, g);
        this.viewData.set(vp, 0);
        this.viewData.set([...cam.pos, 1, ...cam.forward(), 0], 16);
    }

    stamps(i) { return this.querySet ? { querySet: this.querySet, beginningOfPassWriteIndex: i, endOfPassWriteIndex: i + 1 } : undefined; }

    // is a static archetype's bounding sphere inside list `list`'s volume (camera frustum + far, or a cascade box)
    sees(a, list, st, cam) {
        const planes = list ? this.cascadePlanes[list - 1] : this.camPlanes, c = a.sphere[0], r = a.sphere[1];
        if (!list && v3.len(v3.sub(c, cam.pos)) - r > st.far) return false;
        return planes.every(p => p[0] * c[0] + p[1] * c[1] + p[2] * c[2] + p[3] >= -r);
    }

    // draw every archetype's list `list` (0: camera, 1 + c: cascade c); meshPipe(material) picks the mesh pipeline.
    // GPU-culled archetypes draw indirect; static ones (terrain chunks) are culled here and drawn directly,
    // which spares the browser's per-draw validation of hundreds of indirect draws.
    drawLists(pass, archs, list, meshPipe, impPipe, shadow, st, cam) {
        let cur = null;
        for (const a of archs) {
            if (!a.count || (shadow && !a.asset.castShadows)) continue;
            if (a.static) {
                const seen = this.sees(a, list, st, cam);
                if (list) a.cpuCasters += seen ? 1 : 0; else a.visible[0] = seen ? 1 : 0;
                if (!seen) continue;
            }
            const gm = a.asset.gpu(this), base = list * a.setStride;
            pass.setVertexBuffer(0, gm.vbuf);
            pass.setVertexBuffer(1, gm.aoBuf);
            pass.setIndexBuffer(gm.ibuf, 'uint32');
            pass.setBindGroup(2, a.static ? a.srcBG : a.meshBG[list]);
            a.asset.mesh.submeshes.forEach((s, i) => {
                const p = meshPipe(s.material);
                if (p !== cur) { pass.setPipeline(p); cur = p; }
                pass.setBindGroup(1, s.material.bindGroup(this));
                if (a.static) pass.drawIndexed(s.count, a.count, s.first, 0, 0);
                else pass.drawIndexedIndirect(a.args, base + 16 + 20 * i);
            });
        }
        pass.setPipeline(impPipe);
        for (const a of archs) {
            if (!a.count || a.static || !a.asset.atlas || (shadow && !a.asset.castShadows)) continue;
            pass.setBindGroup(1, a.asset.atlas.bg);
            pass.setBindGroup(2, a.impBG[list]);
            pass.drawIndirect(a.args, list * a.setStride);
        }
    }

    // one frame: cull (compute: camera + cascades) -> counts into the indirect args -> shadow cascades ->
    // sky, meshes, imposters, atlas overlay
    render(world, cam, st, time, overlay, env) {
        this.resize();
        const d = this.device, archs = world ? world.list : [];
        this.writeGlobals(cam, env, st, time);
        this.writeShadows(cam, env, st, this.canvas.width / this.canvas.height);
        for (let k = 0; k < LISTS; k++) d.queue.writeBuffer(this.viewBuf, k * 256, this.viewData, k * 64, 24);
        const enc = d.createCommandEncoder();
        for (const a of archs) a.upload(this);
        if (archs.length) {
            const cp = enc.beginComputePass({ timestampWrites: this.stamps(0) });
            cp.setPipeline(this.cullPipe);
            cp.setBindGroup(0, this.globalBG);
            for (const a of archs) if (a.count && !a.static) { cp.setBindGroup(1, a.cullBG); cp.dispatchWorkgroups(Math.ceil(a.count / 64)); }
            cp.end();
        }
        // a few times a second: copy the indirect args back for the HUD's counts
        const doRead = archs.length > 0 && !this.readPending && time - this.lastRead > 0.25;
        const offsets = [];
        let readBytes = 0;
        for (const a of archs) { offsets.push(readBytes); readBytes += a.static ? 0 : a.setStride * LISTS; }
        if (doRead) {
            if (!this.readBuf || this.readBuf.size < readBytes) {
                this.readBuf?.destroy();
                this.readBuf = d.createBuffer({ size: readBytes * 2, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
            }
            archs.forEach((a, i) => { if (!a.static) enc.copyBufferToBuffer(a.args, 0, this.readBuf, offsets[i], a.setStride * LISTS); });
        }

        if (st.shadows && archs.length) for (let c = 0; c < CASCADES; c++) {
            const pass = enc.beginRenderPass({ colorAttachments: [], timestampWrites: this.stamps(2 + c * 2),
                depthStencilAttachment: { view: this.shadowLayers[c], depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store' } });
            pass.setBindGroup(0, this.shadowPassBG);
            pass.setBindGroup(3, this.viewBG, [(c + 1) * 256]);
            this.drawLists(pass, archs, c + 1, m => (m.alphaCutoff > 0 ? this.shadowMeshPipe : this.shadowOpaquePipe), c >= CHEAP_CASCADE ? this.shadowImpCheapPipe : this.shadowImpPipe, true, st, cam);
            pass.end();
        }

        const pass = enc.beginRenderPass({
            timestampWrites: this.stamps(10),
            colorAttachments: [{ view: this.msaaView, resolveTarget: this.ctx.getCurrentTexture().createView(), clearValue: [0, 0, 0, 1], loadOp: 'clear', storeOp: 'discard' }],
            depthStencilAttachment: { view: this.depthView, depthClearValue: 0, depthLoadOp: 'clear', depthStoreOp: 'discard' },
        });
        pass.setPipeline(this.skyPipe);
        pass.setBindGroup(0, this.globalBG);
        pass.draw(3);
        pass.setBindGroup(3, this.viewBG, [0]);
        this.drawLists(pass, archs, 0, m => (m.doubleSided ? this.meshTwoSided : this.meshPipe), this.impPipe, false, st, cam);
        for (const a of archs) if (a.static) { a.casters[0] = st.shadows ? a.cpuCasters : 0; a.cpuCasters = 0; }
        if (overlay) {
            // bottom right, left of the control panel when that is showing
            const W = this.canvas.width, H = this.canvas.height, dpr = W / Math.max(1, this.canvas.clientWidth), m = 12 * dpr;
            const right = (overlay.rightInset || 0) * dpr + m, px = Math.max(64, Math.min(H * 0.42, (W - right) * 0.45, 440 * dpr));
            const s = overlay.sel, x0 = W - right - px, y0 = H - m - px;
            d.queue.writeBuffer(this.overlayBuf, 0, new Float32Array([
                x0 / W * 2 - 1, 1 - y0 / H * 2, (x0 + px) / W * 2 - 1, 1 - (y0 + px) / H * 2,
                ...s.cells[0], ...s.cells[1], ...s.cells[2], overlay.atlas.grid, ATLAS_VIEWS.indexOf(overlay.view), ...s.w, 0,
            ]));
            pass.setPipeline(this.ovPipe);
            pass.setBindGroup(0, overlay.atlas.overlayBG);
            pass.draw(6);
        }
        pass.end();
        const doTime = this.querySet && !this.queryPending && doRead;
        if (doTime) {
            enc.resolveQuerySet(this.querySet, 0, 12, this.queryBuf, 0);
            enc.copyBufferToBuffer(this.queryBuf, 0, this.queryRead, 0, 96);
        }
        d.queue.submit([enc.finish()]);
        if (doTime) {
            this.queryPending = true;
            const shadowsOn = st.shadows && archs.length > 0;
            this.queryRead.mapAsync(GPUMapMode.READ).then(() => {
                const t = new BigUint64Array(this.queryRead.getMappedRange()), ms = k => Math.max(0, Number(t[k + 1] - t[k])) / 1e6;
                this.gpuTimes = { cull: ms(0), shadow: shadowsOn ? [0, 1, 2, 3].map(c => ms(2 + c * 2)) : null, main: ms(10) };
                this.queryRead.unmap();
                this.queryPending = false;
            }).catch(() => { this.queryPending = false; });
        }

        if (doRead) {
            this.readPending = true;
            this.lastRead = time;
            const list = archs.slice(), buf = this.readBuf, n = readBytes;
            buf.mapAsync(GPUMapMode.READ, 0, n).then(() => {
                const u = new Uint32Array(buf.getMappedRange(0, n));
                list.forEach((a, i) => {
                    if (a.static) return;
                    const words = a.setStride / 4, subs = a.asset.mesh.submeshes.length;
                    const count = (k, mesh) => u[offsets[i] / 4 + k * words + (mesh ? 5 : 1)] * (mesh ? (subs ? 1 : 0) : 1);
                    a.visible[0] = count(0, true);
                    a.visible[1] = count(0, false);
                    a.casters = [0, 0];
                    for (let c = 1; c < LISTS; c++) { a.casters[0] += count(c, true); a.casters[1] += count(c, false); }
                });
                buf.unmap();
                this.readPending = false;
            }).catch(() => { this.readPending = false; });
        }
    }
}

// ================================================================ lighting
// A lighting scenario: sun (azimuth / elevation in degrees, colour, intensity), sky, ambient, fog, exposure
// and emission (how bright emissive surfaces glow: lights on at night). All of it is applied per frame by the
// shaders to the surfaces the meshes and imposter atlases carry; nothing of it is baked.
const sunDirFrom = (az, el) => [Math.sin(az * DEG) * Math.cos(el * DEG), Math.sin(el * DEG), Math.cos(az * DEG) * Math.cos(el * DEG)];

function parseEnv(e = {}) {
    const sun = e.sun || {}, sky = e.sky || {}, amb = e.ambient || {}, fog = e.fog || {};
    let az = sun.azimuth, el = sun.elevation;
    if (az === undefined || el === undefined) {
        const d = v3.norm(sun.dir || [0.45, 0.58, 0.62]);
        az = Math.atan2(d[0], d[2]) / DEG;
        el = Math.asin(d[1]) / DEG;
    }
    return {
        azimuth: az, elevation: el, sunDir: sunDirFrom(az, el), sunColor: lin(sun.color || '#fff1dc'), sunIntensity: sun.intensity ?? 2.8,
        skyTop: lin(sky.top || '#3d6fb6'), skyHorizon: lin(sky.horizon || '#bfd3e4'),
        ambientSky: lin(amb.sky || '#a8c4e6'), ambientGround: lin(amb.ground || '#6a604c'), ambientStrength: amb.strength ?? 0.55,
        fogColor: lin(fog.color || '#bccfde'), fogDensity: fog.density ?? 0.002, exposure: e.exposure ?? 1, emission: e.emission ?? 1,
    };
}

function lerpEnv(a, b, t) {
    const o = {};
    for (const k in b) o[k] = Array.isArray(b[k]) ? b[k].map((x, i) => lerp(a[k][i], x, t)) : lerp(a[k], b[k], t);
    o.sunDir = v3.norm(o.sunDir);
    return o;
}

// Lighting: the scenario's named presets, the current environment and animated switches between them
class Lighting {
    constructor() {
        this.presets = {};
        this.name = '';
        this.env = parseEnv();
        this.target = this.env;
        this.from = null;
        this.t = 1;
        this.changes = 0;               // relights since start (switches + sun / emission tweaks)
    }

    get names() { return Object.keys(this.presets); }

    // `environment` names a preset of `lighting`, or is an environment object itself
    load(sc) {
        this.presets = { ...(sc.lighting || {}) };
        let name = sc.environment;
        if (name && typeof name === 'object') { this.presets = { custom: name, ...this.presets }; name = 'custom'; }
        if (!this.presets[name]) name = this.names[0];
        if (!name) { this.presets = { default: {} }; name = 'default'; }
        this.set(name, false);
    }

    set(name, animate = true) {
        if (!this.presets[name]) return;
        this.name = name;
        this.target = parseEnv(this.presets[name]);
        if (animate) { this.from = this.env; this.t = 0; this.changes++; }
        else { this.env = { ...this.target }; this.t = 1; }
    }

    cycle() { const n = this.names; this.set(n[(n.indexOf(this.name) + 1) % n.length]); }

    // azimuth, elevation or emission
    tweak(key, value) {
        this.target[key] = value;
        this.target.sunDir = sunDirFrom(this.target.azimuth, this.target.elevation);
        if (this.t >= 1) this.env = { ...this.target };
        this.changes++;
    }

    update(dt) {
        if (this.t >= 1) return;
        this.t = Math.min(1, this.t + dt / 1.5);
        this.env = lerpEnv(this.from, this.target, smoothstep(0, 1, this.t));
    }
}

// ================================================================ archetypes
// Archetype: every instance of one ModelAsset in a world, and the GPU side of drawing them: source
// instances, the culled mesh / imposter lists (LISTS of them: camera, then one per shadow cascade, each
// `seg` instances long) and their indirect draw arguments (per list, `setStride` bytes: 0..15 imposter draw,
// then one drawIndexedIndirect per submesh), whose instance counts the cull pass fills in.
class Archetype {
    constructor(asset) {
        this.asset = asset;
        this.name = asset.name;
        this.items = [];
        this.count = 0;
        this.visible = [0, 0];          // mesh / imposter instances drawn (read back a few times a second)
        this.casters = [0, 0];          // ... drawn into the shadow cascades (summed)
        // static: one forced-mesh instance that never moves (terrain chunks): culled on the CPU, drawn directly
        this.static = asset.kind === 'generated';
        this.cpuCasters = 0;
        this.dirty = null;              // [first, last] instance range to upload
        this.version = -1;
    }

    add(pos, q, scale, force = 0) {
        this.items.push(pos[0], pos[1], pos[2], scale, q[0], q[1], q[2], q[3], force, 0, 0, 0);
        return this.count++;
    }

    set(i, pos, q, scale) {
        const o = i * INSTANCE_FLOATS, a = this.data;
        a[o] = pos[0]; a[o + 1] = pos[1]; a[o + 2] = pos[2]; a[o + 3] = scale;
        a[o + 4] = q[0]; a[o + 5] = q[1]; a[o + 6] = q[2]; a[o + 7] = q[3];
        this.dirty = this.dirty ? [Math.min(this.dirty[0], i), Math.max(this.dirty[1], i)] : [i, i];
    }

    instance(i) {
        const o = i * INSTANCE_FLOATS, a = this.data;
        return { pos: [a[o], a[o + 1], a[o + 2]], scale: a[o + 3], rot: [a[o + 4], a[o + 5], a[o + 6], a[o + 7]], force: a[o + 8] };
    }

    create(r) {
        const d = r.device, U = GPUBufferUsage, bytes = Math.max(1, this.count) * INSTANCE_BYTES, subs = this.asset.mesh.submeshes;
        this.data = new Float32Array(this.items);
        this.items = null;
        this.seg = Math.max(16, Math.ceil(this.count / 16) * 16);      // 16 instances = 768 bytes: lists start 256-aligned
        const listBytes = this.seg * INSTANCE_BYTES;
        this.setStride = 16 + 20 * subs.length;
        this.src = d.createBuffer({ size: bytes, usage: U.STORAGE | U.COPY_DST });
        this.meshOut = d.createBuffer({ size: listBytes * LISTS, usage: U.STORAGE });
        this.impOut = d.createBuffer({ size: listBytes * LISTS, usage: U.STORAGE });
        this.args = d.createBuffer({ size: this.setStride * LISTS, usage: U.INDIRECT | U.STORAGE | U.COPY_SRC | U.COPY_DST });
        this.params = d.createBuffer({ size: 48, usage: U.UNIFORM | U.COPY_DST });
        const args = new Uint32Array(this.setStride / 4 * LISTS);
        for (let k = 0, o = 0; k < LISTS; k++, o += this.setStride / 4) {
            args[o] = 6;
            subs.forEach((s, i) => { args[o + 4 + 5 * i] = s.count; args[o + 4 + 5 * i + 2] = s.first; });
        }
        this.argsTemplate = args;          // instance counts 0; written back every frame before culling
        if (this.count) d.queue.writeBuffer(this.src, 0, this.data);
        this.cullBG = d.createBindGroup({ layout: r.cullBgl, entries: [
            { binding: 0, resource: { buffer: this.params } }, { binding: 1, resource: { buffer: this.src } },
            { binding: 2, resource: { buffer: this.meshOut } }, { binding: 3, resource: { buffer: this.impOut } },
            { binding: 4, resource: { buffer: this.args } },
        ] });
        const list = (buffer, k) => d.createBindGroup({ layout: r.instBgl, entries: [{ binding: 0, resource: { buffer, offset: k * listBytes, size: listBytes } }] });
        this.meshBG = Array.from({ length: LISTS }, (_, k) => list(this.meshOut, k));
        this.srcBG = d.createBindGroup({ layout: r.instBgl, entries: [{ binding: 0, resource: { buffer: this.src } }] });
        // world-space bounding sphere of a static archetype (its instances do not move)
        const m = this.asset.mesh, inst = this.count ? this.instance(0) : null;
        this.sphere = inst ? [v3.add(inst.pos, quat.rotate(inst.rot, v3.mul(m.center, inst.scale))), m.radius * inst.scale * (this.count > 1 ? 1e6 : 1)] : [[0, 0, 0], 0];
        this.impBG = Array.from({ length: LISTS }, (_, k) => list(this.impOut, k));
    }

    upload(r) {
        const d = r.device, a = this.asset;
        if (this.version !== a.version) {
            this.version = a.version;
            const m = a.mesh, R = m.radius * 1.02, buf = new ArrayBuffer(48), u = new Uint32Array(buf), f = new Float32Array(buf);
            u[0] = this.count; u[1] = a.atlas ? 1 : 0; f[2] = R; f[3] = R / 5 * a.lodBias;
            f.set(m.center, 4);
            u[8] = this.seg; u[9] = a.castShadows ? 1 : 0; u[10] = this.setStride / 4; u[11] = m.submeshes.length;
            d.queue.writeBuffer(this.params, 0, buf);
        }
        d.queue.writeBuffer(this.args, 0, this.argsTemplate);
        if (this.dirty) {
            const [i0, i1] = this.dirty;
            d.queue.writeBuffer(this.src, i0 * INSTANCE_BYTES, this.data, i0 * INSTANCE_FLOATS, (i1 - i0 + 1) * INSTANCE_FLOATS);
            this.dirty = null;
        }
    }

    destroy() { for (const b of [this.src, this.meshOut, this.impOut, this.args, this.params]) b?.destroy(); }
}

// ================================================================ entities
// Each is constructed from a scenario definition ({ type, id, ... }) and spawned once, in scenario order.
class Entity {
    constructor(def, world) {
        this.def = def;
        this.world = world;
        this.id = def.id;
    }
    spawn() {}
    update(dt, t) {}
}

// Heightfield ground: fbm hills, flattened inside `flat` [cx, cz, r0, r1]; a ring of ridged `mountains`
// { inner, outer, height, frequency } around `center`; single `peaks` [x, z, radius, height]. Built in
// `chunks` x `chunks` pieces, each its own model, so the camera and every shadow cascade cull them. Vertex
// colours come from `layers`: grass / dry grass, rock where steep (`rockSlope`: 1 - normal.y range) and
// snow above `snowLine` (a height range). The terrain casts shadows unless `castShadows` is false.
class Terrain extends Entity {
    spawn() {
        const e = this.def, w = this.world;
        this.size = e.size || 1000;
        this.res = e.res || 128;
        this.amp = e.height ?? 10;
        this.freq = e.frequency ?? 0.004;
        this.seed = e.seed ?? 1;
        this.flat = e.flat;
        this.mountains = e.mountains;
        this.peaks = e.peaks || [];
        const n = this.res, S = this.size, step = S / n, H = this.heights = new Float32Array((n + 1) * (n + 1));
        for (let j = 0; j <= n; j++) for (let i = 0; i <= n; i++) H[j * (n + 1) + i] = this.noise(-S / 2 + i * step, -S / 2 + j * step);
        w.terrain = this;

        const h = (i, j) => H[clamp(j, 0, n) * (n + 1) + clamp(i, 0, n)], L = e.layers || {}, mix3 = (a, b, t) => a.map((x, k) => x + (b[k] - x) * t);
        const col = { grass: lin(L.grass || '#5d7a34'), dry: lin(L.dry || '#8c8a4c'), rock: lin(L.rock || '#6f675f'), snow: lin(L.snow || '#f4f6fa') };
        const [s0, s1] = L.rockSlope || [0.3, 0.5], [l0, l1] = L.snowLine || [1e9, 2e9];
        const chunks = clamp(e.chunks || 1, 1, 32), cn = Math.ceil(n / chunks), key = JSON.stringify(e);
        for (let cj = 0; cj < chunks; cj++) for (let ci = 0; ci < chunks; ci++) {
            const i0 = ci * cn, j0 = cj * cn, i1 = Math.min(n, i0 + cn), j1 = Math.min(n, j0 + cn), wd = i1 - i0 + 1;
            if (i0 >= n || j0 >= n) continue;
            const asset = w.lib.generated(`terrain:${e.id || ''}:${ci},${cj}:${key}`, () => {
                const g = new Geo();
                g.col = [];
                for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
                    const x = -S / 2 + i * step, z = -S / 2 + j * step, y = h(i, j);
                    const nrm = v3.norm([h(i - 1, j) - h(i + 1, j), 2 * step, h(i, j - 1) - h(i, j + 1)]), steep = 1 - nrm[1];
                    let c = mix3(col.grass, col.dry, (noise3(x * 0.02, 0, z * 0.02, this.seed + 50) * 0.5 + 0.5) * 0.6);
                    c = mix3(c, col.rock, smoothstep(s0, s1, steep + noise3(x * 0.05, 0, z * 0.05, this.seed + 55) * 0.06));
                    const snow = smoothstep(l0, l1, y + noise3(x * 0.01, 0, z * 0.01, this.seed + 60) * 40) * (1 - smoothstep(0.3, 0.5, steep));
                    g.vert([x, y, z], nrm, [x, z]);
                    g.col.push(...mix3(c, col.snow, snow));
                }
                for (let j = 0; j < j1 - j0; j++) for (let i = 0; i < i1 - i0; i++) {
                    const a = j * wd + i;
                    g.quad(a, a + wd, a + wd + 1, a + 1);
                }
                const b = new MeshBuilder();
                b.add(g, w.lib.material(e.mat));
                return b.finish();
            });
            asset.castShadows = e.castShadows !== false;
            w.archetype(asset).add([0, 0, 0], quat.identity(), 1, FORCE.mesh);
        }
    }

    noise(x, z) {
        const f = this.freq;
        let h = fbm(x * f, z * f, 5, this.seed) * this.amp + fbm(x * f * 0.3, z * f * 0.3, 3, this.seed + 9) * this.amp * 1.4;
        if (this.flat) { const [cx, cz, r0, r1] = this.flat; h *= smoothstep(r0, r1, Math.hypot(x - cx, z - cz)); }
        const m = this.mountains;
        if (m) {
            const [cx, cz] = m.center || [0, 0], ring = smoothstep(m.inner ?? 500, m.outer ?? 1000, Math.hypot(x - cx, z - cz));
            const mf = m.frequency ?? 0.002;
            if (ring > 0) h += ring * (m.height ?? 200) * ridged(x * mf, z * mf, 6, this.seed + 20);
        }
        for (const [px, pz, rad, ph] of this.peaks) {
            const t = 1 - Math.hypot(x - px, z - pz) / rad;
            if (t > 0) h += ph * Math.pow(smoothstep(0, 1, t), 1.6) * (0.7 + 0.5 * ridged(x * 0.004, z * 0.004, 5, this.seed + 30));
        }
        return h;
    }

    height(x, z) {
        const n = this.res, step = this.size / n;
        const gx = clamp((x + this.size / 2) / step, 0, n - 1e-6), gz = clamp((z + this.size / 2) / step, 0, n - 1e-6);
        const i = Math.floor(gx), j = Math.floor(gz), fx = gx - i, fz = gz - j, H = this.heights, k = j * (n + 1) + i;
        const ha = H[k], hb = H[k + n + 1], hc = H[k + n + 2], hd = H[k + 1];
        return fz >= fx ? ha + (hc - hb) * fx + (hb - ha) * fz : ha + (hd - ha) * fx + (hc - hd) * fz;
    }

    // 1 - normal.y: 0 flat, 1 vertical
    slope(x, z) {
        const e = this.size / this.res;
        return 1 - v3.norm([this.height(x - e, z) - this.height(x + e, z), 2 * e, this.height(x, z - e) - this.height(x, z + e)])[1];
    }

    contains(x, z, margin) { return Math.abs(x) < this.size / 2 - margin && Math.abs(z) < this.size / 2 - margin; }
}

// A model at pos (y above the ground unless `absolute`), rot (degrees), scale; `lod` forces mesh / imposter;
// `spin` { axis, speed (deg/s) } turns it; `footprint` keeps scatters away
class Prop extends Entity {
    spawn() {
        const e = this.def, w = this.world, p = e.pos || [0, 0, 0];
        this.arch = w.archetype(e.model);
        this.base = [p[0], p[1] + (e.absolute ? 0 : w.heightAt(p[0], p[2])), p[2]];
        this.rot0 = quat.euler(e.rot);
        this.scale = e.scale ?? 1;
        this.slot = this.arch.add(this.base, this.rot0, this.scale, FORCE[e.lod] ?? 0);
        if (e.footprint) w.occupy(p[0], p[2], e.footprint);
    }

    spinRot(t) {
        const s = this.def.spin;
        return s ? quat.mul(quat.axis(s.axis || [0, 1, 0], (s.speed ?? 20) * DEG * t), this.rot0) : this.rot0;
    }

    update(dt, t) { if (this.def.spin) this.arch.set(this.slot, this.base, this.spinRot(t), this.scale); }
}

// The same model twice, `gap` metres apart along x: forced mesh on the left, forced imposter on the right
class Compare extends Prop {
    spawn() {
        const e = this.def, w = this.world, p = e.pos || [0, 0, 0], gap = e.gap ?? 12;
        this.arch = w.archetype(e.model);
        this.rot0 = quat.euler(e.rot);
        this.scale = e.scale ?? 1;
        this.slots = [[-gap / 2, FORCE.mesh], [gap / 2, FORCE.imposter]].map(([dx, force]) => {
            const x = p[0] + dx, z = p[2], pos = [x, p[1] + w.heightAt(x, z), z];
            if (e.footprint) w.occupy(x, z, e.footprint);
            return { pos, slot: this.arch.add(pos, this.rot0, this.scale, force) };
        });
    }

    update(dt, t) {
        if (!this.def.spin) return;
        const q = this.spinRot(t);
        for (const s of this.slots) this.arch.set(s.slot, s.pos, q, this.scale);
    }
}

// `count` copies in the ring inner..outer around `center` [x, z], random yaw, scale in `scale` [min, max],
// optional `tilt` (degrees), sunk `sink` metres; darts closer than `spacing` * scale to anything are rejected,
// and so are ground steeper than `maxSlope` (1 - normal.y) or higher than `maxHeight` (treeline)
class Scatter extends Entity {
    spawn() {
        const e = this.def, w = this.world, arch = w.archetype(e.model), rnd = rng(e.seed ?? 1);
        const [cx, cz] = e.center || [0, 0], inner = e.inner ?? 0, outer = e.outer ?? 100, count = e.count ?? 100;
        const [s0, s1] = Array.isArray(e.scale) ? e.scale : [e.scale ?? 1, e.scale ?? 1], spacing = e.spacing ?? 2, sink = e.sink ?? 0.15;
        let placed = 0;
        for (let tries = 0; placed < count && tries < count * 12; tries++) {
            const a = rnd() * Math.PI * 2, r = Math.sqrt(lerp(inner * inner, outer * outer, rnd()));
            const x = cx + Math.cos(a) * r, z = cz + Math.sin(a) * r, s = lerp(s0, s1, rnd()), yaw = rnd() * Math.PI * 2;
            const tilt = e.tilt ? quat.axis([rnd() - 0.5, 0, rnd() - 0.5], e.tilt * DEG * rnd()) : null;
            if (w.terrain && !w.terrain.contains(x, z, spacing * s)) continue;
            if (e.maxHeight !== undefined && w.heightAt(x, z) > e.maxHeight) continue;
            if (e.maxSlope !== undefined && w.terrain && w.terrain.slope(x, z) > e.maxSlope) continue;
            if (w.occupied(x, z, spacing * s)) continue;
            w.occupy(x, z, spacing * s);
            let q = quat.axis([0, 1, 0], yaw);
            if (tilt) q = quat.mul(tilt, q);
            arch.add([x, w.heightAt(x, z) - sink * s, z], q, s, 0);
            placed++;
        }
        if (placed < count) w.warnings.push(`scatter "${e.id || e.model}": placed ${placed} of ${count}`);
    }
}

const ENTITY_TYPES = { terrain: Terrain, prop: Prop, compare: Compare, scatter: Scatter };

// ================================================================ world
class World {
    constructor(game, scenario) {
        this.game = game;
        this.sc = scenario;
        this.lib = game.lib;
        this.archetypes = new Map();
        this.list = [];
        this.entities = [];
        this.terrain = null;
        this.occ = new Map();           // spatial hash of footprints: 8 m cells -> [x, z, r, ...]
        this.occMax = 0;
        this.warnings = [];
    }

    async build() {
        this.lib.load(this.sc);
        for (const def of this.sc.entities || []) {
            const T = ENTITY_TYPES[def.type];
            if (!T) { this.warnings.push(`unknown entity type "${def.type}"`); continue; }
            try {
                const e = new T(def, this);
                e.spawn();
                this.entities.push(e);
            } catch (err) {
                this.warnings.push(`${def.type} "${def.id || def.model || ''}": ${err.message}`);
            }
        }
        this.warnings.push(...new Set(this.lib.warnings));
        this.list = [...this.archetypes.values()];
        for (const a of this.list) {
            if (a.asset.settings.enabled && !a.asset.atlas) await this.game.bake(a.asset);
            a.create(this.game.renderer);
        }
    }

    archetype(model) {
        const asset = typeof model === 'string' ? this.lib.asset(model) : model;
        let a = this.archetypes.get(asset.name);
        if (!a) this.archetypes.set(asset.name, a = new Archetype(asset));
        return a;
    }

    heightAt(x, z) { return this.terrain ? this.terrain.height(x, z) : 0; }

    occupy(x, z, r) {
        const k = `${Math.floor(x / 8)},${Math.floor(z / 8)}`;
        let c = this.occ.get(k);
        if (!c) this.occ.set(k, c = []);
        c.push(x, z, r);
        this.occMax = Math.max(this.occMax, r);
    }

    occupied(x, z, r) {
        const reach = r + this.occMax, i0 = Math.floor((x - reach) / 8), i1 = Math.floor((x + reach) / 8);
        const j0 = Math.floor((z - reach) / 8), j1 = Math.floor((z + reach) / 8);
        for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
            const c = this.occ.get(`${i},${j}`);
            if (c) for (let k = 0; k < c.length; k += 3) if (Math.hypot(c[k] - x, c[k + 1] - z) < r + c[k + 2]) return true;
        }
        return false;
    }

    update(dt, t) { for (const e of this.entities) e.update(dt, t); }

    destroy() { for (const a of this.list) a.destroy(); }
}

// ================================================================ camera + input
class FlyCamera {
    constructor() {
        this.pos = [0, 2, 10];
        this.yaw = 0;
        this.pitch = 0;
        this.fov = 60;
        this.speed = 14;
    }

    reset(def = {}, world) {
        const p = def.pos || [0, 2, 10];
        this.pos = [p[0], p[1] + (world ? world.heightAt(p[0], p[2]) : 0), p[2]];
        this.yaw = (def.yaw || 0) * DEG;
        this.pitch = (def.pitch || 0) * DEG;
        this.fov = def.fov || 60;
        this.speed = def.speed || 14;
    }

    forward() { const c = Math.cos(this.pitch); return [-Math.sin(this.yaw) * c, Math.sin(this.pitch), -Math.cos(this.yaw) * c]; }
    right() { return [Math.cos(this.yaw), 0, -Math.sin(this.yaw)]; }
    view() { return m4.lookAt(this.pos, v3.add(this.pos, this.forward()), [0, 1, 0]); }
}

class InputSystem {
    constructor(game) {
        this.game = game;
        this.keys = new Set();
        this.drag = null;
    }

    attach() {
        const c = this.game.canvas, cam = () => this.game.camera;
        c.addEventListener('pointerdown', e => { c.setPointerCapture(e.pointerId); this.drag = [e.clientX, e.clientY]; });
        c.addEventListener('pointermove', e => {
            if (!this.drag) return;
            const k = 0.0035 * (cam().fov / 60);
            cam().yaw -= (e.clientX - this.drag[0]) * k;
            cam().pitch = clamp(cam().pitch - (e.clientY - this.drag[1]) * k, -1.55, 1.55);
            this.drag = [e.clientX, e.clientY];
        });
        const end = () => { this.drag = null; };
        c.addEventListener('pointerup', end);
        c.addEventListener('pointercancel', end);
        c.addEventListener('wheel', e => { e.preventDefault(); cam().speed = clamp(cam().speed * (e.deltaY > 0 ? 0.8 : 1.25), 1, 600); this.game.toast(`Speed ${cam().speed.toFixed(1)} m/s`, 700); }, { passive: false });
        window.addEventListener('keydown', e => {
            if (e.target.closest && e.target.closest('input, select, textarea')) return;
            if (!this.keys.has(e.code)) this.game.onKey(e.code);
            this.keys.add(e.code);
            if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
        });
        window.addEventListener('keyup', e => this.keys.delete(e.code));
        window.addEventListener('blur', () => this.keys.clear());
    }

    update(dt) {
        const k = this.keys, cam = this.game.camera, f = cam.forward(), r = cam.right();
        let mv = [0, 0, 0];
        if (k.has('KeyW') || k.has('ArrowUp')) mv = v3.add(mv, f);
        if (k.has('KeyS') || k.has('ArrowDown')) mv = v3.sub(mv, f);
        if (k.has('KeyD') || k.has('ArrowRight')) mv = v3.add(mv, r);
        if (k.has('KeyA') || k.has('ArrowLeft')) mv = v3.sub(mv, r);
        if (k.has('KeyE') || k.has('Space')) mv[1] += 1;
        if (k.has('KeyQ') || k.has('KeyC')) mv[1] -= 1;
        if (v3.len(mv) === 0) return;
        const sp = cam.speed * (k.has('ShiftLeft') || k.has('ShiftRight') ? 4 : 1);
        cam.pos = v3.madd(cam.pos, v3.norm(mv), sp * dt);
    }
}

// ================================================================ HUD + control panel
class Hud {
    constructor(game) {
        this.game = game;
        this.el = $('#hud');
        this.help = $('#help');
        this.toastEl = $('#toast');
        this.next = 0;
        this.frames = 0;
        this.prev = 0;
        this.fps = 0;
        this.help.innerHTML = [
            '<b>drag</b> look   <b>WASD</b> move   <b>Q/E</b> down/up   <b>Shift</b> fast   <b>wheel</b> speed',
            '<b>1 2 3</b> LOD auto / mesh / imposter   <b>[ ]</b> LOD distance',
            '<b>B</b> frame blend   <b>P</b> parallax   <b>O</b> depth offset   <b>T</b> LOD tint   <b>G</b> shadows',
            '<b>K</b> next lighting   <b>V</b> atlas view   <b>N</b> next model   <b>R</b> reset camera   <b>L</b> load   <b>H</b> hide UI',
            'drop a .glb / .gltf / .obj to bake it, or a scenario .json',
        ].join('\n');
    }

    toast(msg, ms = 2200) {
        const t = this.toastEl;
        t.textContent = msg;
        t.style.display = 'block';
        clearTimeout(this.toastTimer);
        if (ms > 0) this.toastTimer = setTimeout(() => { t.style.display = 'none'; }, ms);
    }

    update(now) {
        this.frames++;
        if (now < this.next) return;
        this.fps = this.frames * 1000 / Math.max(1, now - this.prev);
        this.frames = 0;
        this.prev = now;
        this.next = now + 250;
        const g = this.game, st = g.settings, w = g.world, on = (b, s) => `<span class="${b ? 'on' : 'off'}">${s}</span>`;
        const L = [`<span class="t">ENTITY IMPOSTER // ${(w ? w.sc.name || 'scenario' : 'loading').toUpperCase()}</span>`,
            `fps ${this.fps.toFixed(0).padStart(3)}  cpu ${g.cpuMs.toFixed(2)} ms  pos ${g.camera.pos.map(x => x.toFixed(0)).join(' ')}`
                + (g.renderer.gpuTimes ? `  gpu cull ${g.renderer.gpuTimes.cull.toFixed(2)} shadow ${g.renderer.gpuTimes.shadow ? g.renderer.gpuTimes.shadow.map(x => x.toFixed(2)).join('/') : '-'} main ${g.renderer.gpuTimes.main.toFixed(2)} ms` : ''),
            `lod <span class="w">${st.lodMode.toUpperCase()}</span> ${st.lodDistance.toFixed(0)} m/5m radius  ${on(st.blend, 'blend')} ${on(st.parallax, 'parallax')} ${on(st.depthOffset, 'depth')} ${on(st.tint, 'tint')}`,
            `light <span class="w">${g.lighting.name.toUpperCase()}</span> sun ${g.lighting.env.azimuth.toFixed(0)}/${g.lighting.env.elevation.toFixed(0)} deg  relights ${g.lighting.changes}  atlas bakes ${g.bakes} <span class="${g.bakesAfterRelight ? 'w' : 'on'}">(${g.bakesAfterRelight} after relighting)</span>`, ''];
        if (w) {
            L.push('<span class="muted">MODEL            INST   MESH    IMP  SHADOW   TRIS/INST  ATLAS</span>');
            let drawn = 0, all = 0, mem = 0, shadowTris = 0;
            const ground = { n: 0, m: 0, cast: 0, tris: 0, casts: false };
            for (const a of w.list) {
                const t = a.asset.mesh.triangles, at = a.asset.atlas, [m, i] = a.visible, [cm, ci] = a.casters;
                drawn += m * t + i * 2;
                shadowTris += cm * t + ci * 2;
                all += (m + i) * t;
                if (a.asset.kind === 'generated') {              // terrain chunks: one row
                    ground.n++; ground.m += m; ground.cast += cm; ground.tris += t; ground.casts ||= a.asset.castShadows;
                    continue;
                }
                if (at) mem += at.bytes;
                const atlas = at ? `${at.grid}x${at.grid}@${at.res} ${at.full ? 'full' : 'hemi'} ${at.layers}L ${(at.bytes / 1048576).toFixed(0)}MB` : '<span class="off">none</span>';
                const name = a.name.replace(/^terrain:.*/, 'terrain').slice(0, 15);
                const cast = a.asset.castShadows && st.shadows ? String(cm + ci) : '-';
                L.push(`${(a.name === st.focus ? '<span class="w">' + name.padEnd(15) + '</span>' : name.padEnd(15))} ${String(a.count).padStart(5)} ${String(m).padStart(6)} ${String(i).padStart(6)} ${cast.padStart(7)} ${fmtK(t).padStart(11)}  ${atlas}`);
            }
            if (ground.n) L.splice(L.length - w.list.length + ground.n, 0,
                `${'terrain'.padEnd(15)} ${String(ground.n).padStart(5)} ${String(ground.m).padStart(6)} ${'0'.padStart(6)} ${(ground.casts && st.shadows ? String(ground.cast) : '-').padStart(7)} ${fmtK(ground.tris).padStart(11)}  <span class="off">${ground.n} chunks</span>`);
            L.push('', `triangles drawn ${fmtK(drawn)}  <span class="muted">(all as mesh: ${fmtK(all)})</span>  shadows ${st.shadows ? fmtK(shadowTris) : 'off'}  atlases ${(mem / 1048576).toFixed(0)} MB`);
            const f = g.focusInfo;
            if (f) L.push(`focus ${f.name}: frames ${f.sel.cells.map((c, k) => `(${c[0]},${c[1]}) ${f.sel.w[k].toFixed(2)}`).join('  ')}`);
            if (w.warnings.length) L.push(`<span class="d">${w.warnings.length} warning(s), see console</span>`);
        }
        this.el.innerHTML = L.join('\n');
    }
}

        const seg = (k, vals) => `<div class="seg" data-k="${k}">${vals.map(v => `<button data-v="${v}">${v}</button>`).join('')}</div>`;
        const range = (k, label, min, max, step) => `<label class="row"><span>${label}</span><input type="range" data-k="${k}" min="${min}" max="${max}" step="${step}"><b data-o="${k}"></b></label>`;
        const chk = (k, label) => `<label class="row chk"><input type="checkbox" data-k="${k}">${label}</label>`;
        const sel = (k, vals) => `<select data-b="${k}">${vals.map(v => `<option value="${v}">${v}</option>`).join('')}</select>`;
        el.innerHTML = `
            <div class="t">GPU <span class="muted">(picking one reloads)</span></div>
            <div class="row" data-o="gpu"><span>adapter</span></div>
            <div class="t">RUNTIME</div>
            <div class="row"><span>LOD</span>${seg('lodMode', LOD_MODES)}</div>
            ${range('lodDistance', 'LOD dist', 2, 300, 1)}
            ${range('fade', 'fade band', 0, 0.8, 0.01)}
            ${range('far', 'far', 100, 3000, 10)}
            ${chk('blend', 'blend 3 frames')}
            ${chk('parallax', 'depth parallax')}
            ${chk('depthOffset', 'pixel depth offset')}
            ${chk('tint', 'LOD tint + billboards')}
            <div class="row"><span>atlas</span><select data-k="atlasView">${ATLAS_VIEWS.map(v => `<option value="${v}">${v}</option>`).join('')}</select></div>
            <div class="t">SHADOWS</div>
            ${chk('shadows', `${CASCADES} cascades, imposters cast + receive`)}
            ${range('shadowDistance', 'distance', 40, 2500, 10)}
            ${chk('cascadeTint', 'tint by cascade')}
            <div class="t">LIGHTING <span class="muted">(runtime only, never rebakes)</span></div>
            <div class="row"><span>preset</span><select data-l="preset"></select></div>
            <label class="row"><span>sun az</span><input type="range" data-l="azimuth" min="0" max="360" step="1"><b data-lo="azimuth"></b></label>
            <label class="row"><span>sun el</span><input type="range" data-l="elevation" min="2" max="90" step="1"><b data-lo="elevation"></b></label>
            <label class="row"><span>lights</span><input type="range" data-l="emission" min="0" max="2" step="0.01"><b data-lo="emission"></b></label>
            <div class="t">BAKE</div>
            <div class="row"><span>model</span><select data-b="focus"></select></div>
            <div class="row"><span>frames</span>${sel('grid', GRID_CHOICES)}${sel('res', RES_CHOICES)}${sel('mode', ['hemi', 'full'])}</div>
            <div class="row"><button class="act" data-a="rebake">Rebake</button></div>
            <div class="row muted" data-o="bakeInfo"></div>
            <div class="t">DATA</div>
            <div class="row"><button class="act" data-a="load">Load model / scenario…</button></div>
            <div class="row"><button class="act" data-a="export">Export scenario JSON</button></div>`;
        this.field('[data-o=gpu]').appendChild(GpuChoice.select());
        el.addEventListener('click', e => {
            const b = e.target.closest('button');
            if (!b) return;
            const s = b.closest('.seg');
            if (s) this.game.set(s.dataset.k, b.dataset.v);
            else this.game.action(b.dataset.a);
            b.blur();
        });
        const value = t => (t.type === 'checkbox' ? t.checked : t.type === 'range' ? +t.value : t.value);
        el.addEventListener('input', e => {
            const t = e.target;
            if (t.dataset.k) this.game.set(t.dataset.k, value(t));
            else if (t.dataset.l && t.type === 'range') this.game.relight(t.dataset.l, value(t));
        });
        el.addEventListener('change', e => {
            const t = e.target;
            if (t.dataset.b === 'focus') this.game.set('focus', t.value);
            if (t.dataset.l === 'preset') this.game.relight('preset', t.value);
            t.blur();
        });
    }

    field(sel) { return this.el.querySelector(sel); }

    sync() {
        const st = this.game.settings, el = this.el;
        el.querySelectorAll('.seg').forEach(s => s.querySelectorAll('button').forEach(b => b.classList.toggle('on', st[s.dataset.k] === b.dataset.v)));
        el.querySelectorAll('input[data-k], select[data-k]').forEach(i => { if (i.type === 'checkbox') i.checked = !!st[i.dataset.k]; else i.value = st[i.dataset.k]; });
        const L = this.game.lighting, ps = this.field('[data-l=preset]');
        if (ps.dataset.names !== L.names.join('|')) { ps.innerHTML = L.names.map(n => `<option>${n}</option>`).join(''); ps.dataset.names = L.names.join('|'); }
        ps.value = L.name;
        el.querySelectorAll('input[data-l]').forEach(i => { i.value = L.target[i.dataset.l]; });
        el.querySelectorAll('b[data-lo]').forEach(b => { const v = L.target[b.dataset.lo]; b.textContent = b.dataset.lo === 'emission' ? v.toFixed(2) : v.toFixed(0); });
        el.querySelectorAll('b[data-o]').forEach(b => {
            const v = st[b.dataset.o];
            b.textContent = b.dataset.o === 'fade' ? v.toFixed(2) : v.toFixed(0);
        });
        const w = this.game.world, f = this.field('[data-b=focus]');
        const names = w ? w.list.filter(a => a.asset.settings.enabled).map(a => a.name) : [];
        if (f.dataset.names !== names.join('|')) { f.innerHTML = names.map(n => `<option>${n}</option>`).join(''); f.dataset.names = names.join('|'); }
        f.value = st.focus;
        const a = w && w.archetypes.get(st.focus), s = a && a.asset.settings, at = a && a.asset.atlas;
        if (s && s.enabled && document.activeElement?.tagName !== 'SELECT') {
            this.field('[data-b=grid]').value = s.grid;
            this.field('[data-b=res]').value = s.res;
            this.field('[data-b=mode]').value = s.mode;
        }
        this.field('[data-o=bakeInfo]').textContent = at
            ? `${at.grid * at.res}px atlas, ${at.levels} mips, ${a.asset.mesh.triangles} tris, baked in ${at.bakeMs.toFixed(0)} ms`
            : '';
    }

    bakeSettings() {
        return { grid: +this.field('[data-b=grid]').value, res: +this.field('[data-b=res]').value, mode: this.field('[data-b=mode]').value };
    }
}

// ================================================================ game
class Game {
    constructor(scenario, canvas) {
        this.canvas = canvas;
        this.scenario = scenario;
        this.baseScenario = scenario;       // last scenario loaded from data (drops of models derive from it)
        this.renderer = new Renderer();
        this.lib = new ModelLibrary();
        this.camera = new FlyCamera();
        this.lighting = new Lighting();
        this.bakes = 0;                     // atlas bakes since start
        this.bakesAfterRelight = 0;         // ... since the lighting first changed (only manual rebakes / new models)
        this.input = new InputSystem(this);
        this.hud = new Hud(this);
        this.world = null;
        this.loading = false;
        this.baking = false;
        this.cpuMs = 0;
        this.time = 0;
        this.last = 0;
        this.focusInfo = null;
        this.settings = {
            lodMode: 'auto', lodDistance: 40, fade: 0.25, far: 2400, blend: true, parallax: true, depthOffset: true, tint: false, atlasView: 'off', focus: '',
            shadows: true, shadowDistance: 1200, shadowLambda: 0.85, cascadeTint: false,
        };
        this.frame = this.frame.bind(this);
    }

    async start() {
        await this.renderer.init(this.canvas);
        this.baker = new ImposterBaker(this.renderer);
        this.panel = new ControlPanel(this);
        this.input.attach();
        this.attachFiles();
        requestAnimationFrame(this.frame);
        await this.loadScenario(this.scenario);
    }

    toast(msg, ms) { this.hud.toast(msg, ms); }

    applyScenarioSettings(sc) {
        const lod = sc.lod || {}, imp = sc.imposter || {}, st = this.settings;
        Object.assign(st, {
            lodMode: LOD_MODES.includes(lod.mode) ? lod.mode : 'auto', lodDistance: lod.distance ?? 40, fade: lod.fade ?? 0.25, far: lod.far ?? 2400,
            blend: imp.blend ?? true, parallax: imp.parallax ?? true, depthOffset: imp.depthOffset ?? true,
        });
        const sh = sc.shadows || {};
        Object.assign(st, { shadows: sh.enabled ?? true, shadowDistance: sh.distance ?? 1200, shadowLambda: sh.lambda ?? 0.85 });
        this.renderer.ensureShadowMap(sh.resolution ?? 2048);
    }

    // build a world from scenario data and make it current; `fromData` = a scenario (not a model drop)
    async loadScenario(sc, { resetCamera = true, fromData = true } = {}) {
        if (this.loading) { this.toast('Still loading…'); return; }
        this.loading = true;
        try {
            const world = new World(this, sc);
            await world.build();
            const old = this.world;
            this.world = world;
            this.scenario = sc;
            if (fromData) { this.baseScenario = sc; this.applyScenarioSettings(sc); this.lighting.load(sc); }
            old?.destroy();
            this.lib.flushRetired();
            if (resetCamera) this.camera.reset(sc.camera, world);
            const imp = world.list.filter(a => a.asset.settings.enabled);
            if (!imp.some(a => a.name === this.settings.focus)) this.settings.focus = (imp.find(a => a.asset.kind === 'import') || imp.find(a => a.name === 'oak') || imp[0] || {}).name || '';
            this.panel.sync();
            const inst = world.list.reduce((n, a) => n + a.count, 0);
            if (world.warnings.length) { console.warn('Scenario warnings:\n' + world.warnings.join('\n')); this.toast(`${world.warnings.length} scenario warning(s), see console`, 4000); }
            else this.toast(`Loaded "${sc.name || 'scenario'}": ${fmtK(inst)} instances of ${world.list.length} models`);
        } catch (err) {
            console.error(err);
            this.toast('Scenario error: ' + err.message, 6000);
        } finally {
            this.loading = false;
        }
    }

    // bake (or rebake) one model's atlas; the old atlas stays in use until the new one is ready
    async bake(asset) {
        const s = asset.settings;
        this.toast(`Baking ${asset.name}: ${s.grid}x${s.grid} frames @ ${s.res}px (${s.mode})…`, 0);
        await nextFrame();
        await nextFrame();
        const old = asset.atlas;
        asset.atlas = await this.baker.bake(asset);
        asset.version++;
        this.bakes++;
        if (this.lighting.changes) this.bakesAfterRelight++;
        old?.destroy();
        this.toast(`Baked ${asset.name} in ${asset.atlas.bakeMs.toFixed(0)} ms`, 1500);
    }

    async rebake() {
        const a = this.world && this.world.archetypes.get(this.settings.focus);
        if (!a || this.baking || this.loading) return;
        this.baking = true;
        try {
            Object.assign(a.asset.settings, this.panel.bakeSettings());
            await this.bake(a.asset);
        } catch (err) {
            console.error(err);
            this.toast('Bake failed: ' + err.message, 5000);
        } finally {
            this.baking = false;
            this.panel.sync();
        }
    }

    relight(k, v) {
        const L = this.lighting;
        if (k === 'preset') { L.set(v); this.toast(`Lighting: ${v} (no rebake)`, 1200); }
        else L.tweak(k, v);
        this.panel.sync();
    }

    set(k, v) {
        const st = this.settings;
        st[k] = v;
        if (k === 'lodMode') this.toast(`LOD: ${v}`, 900);
        this.panel.sync();
    }

    action(a) {
        if (a === 'rebake') this.rebake();
        else if (a === 'load') $('#file').click();
        else if (a === 'export') {
            const url = URL.createObjectURL(new Blob([JSON.stringify(this.baseScenario, null, 2)], { type: 'application/json' }));
            const link = Object.assign(document.createElement('a'), { href: url, download: 'scenario.json' });
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
    }

    onKey(code) {
        const st = this.settings, toggle = (k, label) => { this.set(k, !st[k]); this.toast(`${label} ${st[k] ? 'ON' : 'OFF'}`, 900); };
        switch (code) {
            case 'Digit1': this.set('lodMode', 'auto'); break;
            case 'Digit2': this.set('lodMode', 'mesh'); break;
            case 'Digit3': this.set('lodMode', 'imposter'); break;
            case 'KeyB': toggle('blend', 'Frame blending'); break;
            case 'KeyP': toggle('parallax', 'Depth parallax'); break;
            case 'KeyO': toggle('depthOffset', 'Pixel depth offset'); break;
            case 'KeyT': toggle('tint', 'LOD tint'); break;
            case 'KeyG': toggle('shadows', 'Shadows'); break;
            case 'KeyV': this.set('atlasView', ATLAS_VIEWS[(ATLAS_VIEWS.indexOf(st.atlasView) + 1) % ATLAS_VIEWS.length]); break;
            case 'KeyN': {
                const names = this.world ? this.world.list.filter(a => a.asset.settings.enabled).map(a => a.name) : [];
                if (names.length) { this.set('focus', names[(names.indexOf(st.focus) + 1) % names.length]); this.toast(`Focus: ${st.focus}`, 900); }
                break;
            }
            case 'BracketLeft': this.set('lodDistance', Math.max(2, Math.round(st.lodDistance / 1.25))); break;
            case 'BracketRight': this.set('lodDistance', Math.min(300, Math.round(st.lodDistance * 1.25))); break;
            case 'KeyR': this.camera.reset(this.scenario.camera, this.world); break;
            case 'KeyL': $('#file').click(); break;
            case 'KeyK': this.lighting.cycle(); this.toast(`Lighting: ${this.lighting.name} (no rebake)`, 1200); this.panel.sync(); break;
            case 'KeyH': document.body.classList.toggle('hidden-ui'); break;
        }
    }

    attachFiles() {
        const input = $('#file'), zone = $('#dropzone');
        input.addEventListener('change', () => { if (input.files.length) this.loadFiles([...input.files]); input.value = ''; });
        let depth = 0;
        document.addEventListener('dragenter', e => { e.preventDefault(); depth++; zone.classList.add('show'); });
        document.addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; zone.classList.remove('show'); } });
        document.addEventListener('dragover', e => e.preventDefault());
        document.addEventListener('drop', e => {
            e.preventDefault();
            depth = 0;
            zone.classList.remove('show');
            if (e.dataTransfer.files.length) this.loadFiles([...e.dataTransfer.files]);
        });
    }

    // a scenario .json, or a model (+ its companion files) that replaces the scenario's `drop` targets
    async loadFiles(list) {
        const files = new Map(list.map(f => [f.name.toLowerCase(), f]));
        const main = list.find(f => /\.(glb|gltf|obj)$/i.test(f.name)) || list.find(f => /\.json$/i.test(f.name));
        if (!main) { this.toast('Drop a .glb, .gltf, .obj or a scenario .json'); return; }
        if (this.loading || this.baking) { this.toast('Busy, try again in a moment'); return; }
        try {
            if (/\.json$/i.test(main.name)) { await this.loadScenario(JSON.parse(await main.text())); return; }
            this.toast(`Loading ${main.name}…`, 0);
            await nextFrame();
            const mesh = /\.obj$/i.test(main.name) ? await ObjLoader.load(main, files) : await GltfLoader.load(main, files);
            const base = this.baseScenario, drop = base.drop || {};
            mesh.fit(drop.fit ?? 6);
            const name = 'import:' + main.name.replace(/\.[^.]+$/, '');
            this.lib.addImport(name, mesh, drop.imposter);
            const sc = structuredClone(base);
            for (const e of sc.entities || []) if ((drop.replace || []).includes(e.id)) e.model = name;
            if (drop.field) sc.entities.push({ ...drop.field, model: name });
            this.settings.focus = name;
            await this.loadScenario(sc, { resetCamera: false, fromData: false });
        } catch (err) {
            console.error(err);
            this.toast(`Could not load ${main.name}: ${err.message}`, 6000);
        }
    }

    // the focused model's nearest instance: which atlas frames it uses right now (atlas overlay, HUD)
    updateFocus() {
        const w = this.world, a = w && w.archetypes.get(this.settings.focus), at = a && a.asset.atlas;
        if (!at || !a.data) { this.focusInfo = null; return; }
        let best = -1, bd = Infinity;
        for (let i = 0; i < a.count; i++) {
            const o = i * INSTANCE_FLOATS, dd = (a.data[o] - this.camera.pos[0]) ** 2 + (a.data[o + 1] - this.camera.pos[1]) ** 2 + (a.data[o + 2] - this.camera.pos[2]) ** 2;
            if (a.data[o + 8] !== FORCE.mesh && dd < bd) { bd = dd; best = i; }
        }
        if (best < 0) { this.focusInfo = null; return; }
        const inst = a.instance(best), c = v3.add(inst.pos, quat.rotate(inst.rot, v3.mul(at.center, inst.scale)));
        const dir = quat.rotate(quat.conj(inst.rot), v3.norm(v3.sub(this.camera.pos, c)));
        const panel = document.body.classList.contains('hidden-ui') ? null : this.panel.el.getBoundingClientRect();
        this.focusInfo = {
            name: a.name, atlas: at, sel: Oct.select(dir, at.grid, at.full, this.settings.blend), view: this.settings.atlasView,
            rightInset: panel && panel.width && panel.width < window.innerWidth * 0.6 ? window.innerWidth - panel.left : 0,
        };
    }

    frame(now) {
        requestAnimationFrame(this.frame);
        const dt = Math.min(0.1, this.last ? (now - this.last) / 1000 : 0);
        this.last = now;
        this.time += dt;
        const t0 = performance.now(), w = this.world, cam = this.camera;
        this.input.update(dt);
        this.lighting.update(dt);
        if (w) {
            w.update(dt, this.time);
            cam.pos[1] = Math.max(cam.pos[1], w.heightAt(cam.pos[0], cam.pos[2]) + 0.5);
        }
        this.updateFocus();
        const f = this.focusInfo;
        this.renderer.render(w, cam, this.settings, this.time, f && this.settings.atlasView !== 'off' ? f : null, this.lighting.env);
        this.cpuMs = lerp(this.cpuMs, performance.now() - t0, 0.1);
        this.hud.update(now);
        if (now - (this.lastSync || 0) > 500) { this.lastSync = now; if (!this.baking) this.panel.sync(); }
    }
}

// ================================================================ main
function showFallback(e) {
    console.error(e);
    $('#error-message').textContent = String((e && e.stack) || e);
    if (!$('#fallback .gpu-pick')) $('#fallback .card').appendChild(GpuChoice.panel());
    $('#fallback').classList.add('show');
}

window.addEventListener('DOMContentLoaded', async () => {
    let scenario;
    try {
        scenario = JSON.parse($('#scenario').textContent);
    } catch (err) {
        showFallback(new Error('Embedded scenario is not valid JSON: ' + err.message));
        return;
    }
    const game = new Game(scenario, $('#view'));
    game.renderer.onError = showFallback;
    window.imposterDemo = game;        // handy from the devtools console: world, lib, settings, camera
    try {
        await game.start();
    } catch (err) {
        showFallback(err);
    }
});
</script>
</body>
